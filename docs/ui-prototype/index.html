  <style>

0}.summary div{display:flex;justify-content:space-between;font-size:12px;margin:8px 0}.summary .total{font-size:17px;font-weight:700;color:#a66f87;border-top:1px solid #e6ced9;padding-top:12px}.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:98px}.bubble{max-width:86%;border-radius:20px;padding:12px 14px;font-size:12px;line-height:1.65}.bubble.ai{background:var(--white);border:1px solid var(--line);border-top-left-radius:7px}.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#d6a5b8,#b7a4cb);color:white;border-bottom-right-radius:7px}.ai-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;gap:10px}.ai-card .pic{width:64px;height:64px}.chat-input{position:absolute;z-index:5;left:12px;right:12px;bottom:78px;border:1px solid var(--line);border-radius:20px;background:rgba(255,253,253,.98);padding:7px;display:flex;gap:7px;box-shadow:var(--shadow)}.chat-input input{flex:1;border:0;background:transparent;outline:0;padding:0 8px;font-size:12px}.chat-input button{width:40px;height:40px;border:0;border-radius:14px;background:var(--rose);color:white}.chat-input .more{background:var(--rose-3);color:var(--rose)}.quick-prompts{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin:5px 0 10px}.quick-prompts button{white-space:nowrap;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:8px 11px;font-size:10px;color:#947786}.order{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:15px;margin:11px 0}.order-top{display:flex;justify-content:space-between;font-size:12px}.order strong{color:#a56e86}.timeline{border-left:2px solid var(--rose-2);margin:15px 5px;padding-left:15px}.timeline div{font-size:11px;margin:13px 0;position:relative}.timeline div:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--rose);left:-20px;top:4px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:38px;margin-bottom:12px}.sheet{position:absolute;inset:0;background:rgba(111,89,103,.18);z-index:8;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s}.sheet.open{opacity:1;pointer-events:auto}.sheet-body{width:100%;max-height:86%;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:20px 20px 28px;transform:translateY(100%);transition:.25s}.sheet.open .sheet-body{transform:none}.field{margin:11px 0}.field label{font-size:10px;color:var(--muted);display:block;margin:0 0 5px 4px}.field input{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:12px;outline:0}.pay,.delivery{display:flex;gap:8px;margin:12px 0}.pay button,.delivery button{flex:1;border:1px solid var(--line);background:white;border-radius:14px;padding:10px 4px;font-size:10px}.pay button.active,.delivery button.active{border-color:var(--rose);background:var(--rose-3)}
    .icon-btn{position:relative}.notice-dot{width:7px;height:7px;border-radius:50%;background:var(--rose);position:absolute;right:9px;top:8px}.banner-dots{position:absolute;bottom:13px;right:18px;display:flex;gap:5px}.banner-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}.banner-dots i.active{width:16px;border-radius:9px;background:white}.review{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0;font-size:11px;line-height:1.65}.review-head{display:flex;justify-content:space-between;margin-bottom:7px}.review-head span{color:#b27890}.spec-row{display:flex;gap:8px;flex-wrap:wrap}.spec{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px;font-size:11px}.spec.active{border-color:var(--rose);background:var(--rose-3)}.profile-card{background:linear-gradient(135deg,#d4a3b7,#b7a4cb);color:white;border-radius:25px;padding:20px;display:flex;align-items:center;gap:13px}.avatar{width:55px;height:55px;border-radius:21px;background:rgba(255,255,255,.75);color:#a8758a;display:grid;place-items:center;font-size:23px}.profile-card small{display:block;margin-top:5px;opacity:.8}.order-grid,.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.order-grid button,.service-grid button{border:0;background:var(--white);border-radius:17px;padding:12px 3px;color:var(--ink);font-size:10px}.order-grid span,.service-grid span{display:block;font-size:20px;margin-bottom:6px}.service-grid{grid-template-columns:repeat(2,1fr)}.service-grid button{text-align:left;padding:14px}.service-grid span{display:inline;margin-right:8px}.side-mask{position:absolute;inset:0;z-index:9;background:rgba(111,89,103,.18);opacity:0;pointer-events:none;transition:.2s}.side-mask.open{opacity:1;pointer-events:auto}.side-panel{width:82%;height:100%;background:var(--paper);padding:46px 18px 20px;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}.side-mask.open .side-panel{transform:none}.history-item{padding:13px;border-radius:15px;margin:7px 0;background:var(--white);border:1px solid var(--line);font-size:12px}.history-item small{display:block;color:var(--muted);margin-top:5px}

<body>
  <main class="stage">
    <aside class="notes">
      <div class="eyebrow">UI DIRECTION 01</div>
      <h1>柔和，但不甜腻。<br>像一家会懂你的店。</h1>
      <p>以灰调玫瑰粉和雾紫为主色，不使用纯黑。AI 是贯穿选购、比较、加购和结算确认的辅助能力，不再把产品局限为“寻物”。</p>
      <div class="palette"><i class="swatch" style="background:#c98fa6"></i><i class="swatch" style="background:#e7bdca"></i><i class="swatch" style="background:#b4a1c8"></i><i class="swatch" style="background:#fff9fb"></i><i class="swatch" style="background:#6f5967"></i></div>
      <div class="tip">当前原型已覆盖：首页、分类、详情、AI 选购、购物车、结算、订单与状态反馈。底部导航始终保留，AI 不再跳出商城。</div>
    </aside>
    <section class="phone" aria-label="绮饰集 Charmora 手机商城原型">
      <div class="status"><span>9:41</span><span>◔ ᯤ ▰</span></div>
      <div class="app">
        <div class="screen" id="screen"></div>
        <nav><button data-page="home" class="active"><span>⌂</span>首页</button><button data-page="category"><span>⌗</span>分类</button><button data-page="ai" class="ai-nav"><span>✦</span>AI选购</button><button data-page="cart"><span>♧</span>购物车</button><button data-page="mine"><span>♙</span>我的</button></nav>
        <div class="toast" role="status">已加入购物车 ♡</div>
        <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
        <div class="side-mask" id="historyMask"><aside class="side-panel" id="historyPanel"></aside></div>
      </div>
    </section>
  </main>
  <script>
    const root=document.querySelector('#screen'),toast=document.querySelector('.toast'),sheet=document.querySelector('#sheet'),sheetBody=document.querySelector('#sheetBody'),historyMask=document.querySelector('#historyMask'),historyPanel=document.querySelector('#historyPanel');
    const img=i=>`../../ecommerce_agent_dataset/synthetic_lifestyle_v1/images/category-0${i}.jpg`;
    const baseProducts=[
      ['珍珠蝴蝶结发夹','温柔光泽 · 不易滑落',19.9,1,'首饰发饰',['珍珠点缀','日常百搭','轻盈']],['莫兰迪抓夹三件套','大小组合 · 稳固夹发',24.9,1,'首饰发饰',['三件套','磨砂质感','通勤']],
      ['软乎乎云朵挂件','轻柔触感 · 通勤陪伴',29.9,2,'挂件毛绒',['柔软短绒','可拆挂扣','送礼']],['奶油小熊公仔','坐姿造型 · 亲肤面料',49.9,2,'挂件毛绒',['亲肤面料','可爱摆件','治愈系']],
      ['雾紫随行收纳包','分区收纳 · 防泼水',39.9,3,'包袋收纳',['多层分区','防泼水','轻便']],['奶油色托特包','大容量 · 内置小袋',69.9,3,'包袋收纳',['大容量','帆布质感','通勤']],
      ['柔雾化妆刷套装','细软刷毛 · 七支装',45.9,4,'美妆工具',['七支装','柔软刷毛','收纳袋']],['便携折叠化妆镜','双面镜 · 可调角度',18.9,4,'美妆工具',['双面镜','轻巧便携','可折叠']],
      ['花瓣便签组合','柔和配色 · 80 张',12.9,5,'文具',['80张','可重复粘贴','手账']],['奶油色按动中性笔','顺滑速干 · 五支装',15.9,5,'文具',['五支装','速干墨水','顺滑']],
      ['云朵香薰夜灯','暖光调节 · 定时关闭',79.9,6,'家居日用',['三档暖光','定时关闭','氛围灯']],['桌面分格收纳盒','自由组合 · 圆角设计',32.9,6,'家居日用',['自由组合','圆角设计','桌面收纳']],
      ['小小心意礼赠盒','精选搭配 · 可写祝福',59.9,7,'礼赠组合',['礼盒包装','祝福卡片','精选组合']],['生日惊喜组合','挂件发夹 · 礼袋包装',89.9,7,'礼赠组合',['生日礼物','礼袋包装','两件组合']]
    ].map((x,i)=>({baseId:i+1,name:x[0],meta:x[1],price:x[2],img:img(x[3]),cat:x[4],tags:x[5]}));
    const products=baseProducts.flatMap((p,index)=>['',' · 柔粉款',' · 雾紫款'].map((variant,v)=>({...p,id:index*3+v+1,name:p.name+variant,price:p.price+[0,3,5][v]})));
    const categories=['全部','首饰发饰','挂件毛绒','包袋收纳','美妆工具','文具','家居日用','礼赠组合'];
    const banners=[
      {mini:'NEW COLLECTION',title:'柔雾饰品上新',copy:'精选发饰 2 件 9 折',button:'去看看',color:'linear-gradient(130deg,#d6a5b8,#b7a4cb)',cat:'首饰发饰'},
      {mini:'GIFT GUIDE',title:'把心意认真装好',copy:'礼赠组合满 79 元包邮',button:'选礼物',color:'linear-gradient(130deg,#c6a6b6,#a99fc4)',cat:'礼赠组合'},
      {mini:'ROOM REFRESH',title:'桌面收纳焕新',copy:'收纳好物第二件 8 折',button:'逛家居',color:'linear-gradient(130deg,#c49bab,#9faec9)',cat:'家居日用'}];
    let cart=[{...products[2],qty:1},{...products[4],qty:1}],favorites=new Set(),current='home',categoryName='全部',bannerIndex=0,lastOrder=null;
    let chatMessages=[{role:'ai',text:'你好呀，我可以按预算、场景和偏好帮你选商品，也能比较、加购和生成订单预览。'}];
    const money=n=>`¥ ${n.toFixed(1)}`;
    const notify=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)};
    const header=(title='绮饰集',sub='CHARMORA · LIFESTYLE',left='')=>`<header>${left||`<div class="brand"><small>${sub}</small><strong>${title}</strong></div>`}<button class="icon-btn" data-notice aria-label="消息通知">✉<i class="notice-dot"></i></button></header>`;
    const productCard=p=>`<article class="card" data-detail="${p.id}"><div class="pic" style="background-image:url('${p.img}')"></div><button class="heart ${favorites.has(p.id)?'active':''}" data-fav="${p.id}" aria-label="收藏${p.name}">♥</button><h4>${p.name}</h4><p class="meta">${p.meta}</p><div class="price"><span>${money(p.price)}</span><button class="plus" data-add="${p.id}">＋</button></div></article>`;
    function home(){const b=banners[bannerIndex],featured=products.filter((_,i)=>i%3===0);return `<div class="page">${header()}<label class="search"><span>⌕</span><input id="homeSearch" placeholder="搜索商品"><button data-search style="border:0;background:none;color:var(--rose)">搜索</button></label><section class="hero" style="background:${b.color}"><div class="mini">${b.mini}</div><h2>${b.title}<br><small style="font:12px sans-serif">${b.copy}</small></h2><button data-banner-cat="${b.cat}">${b.button} →</button><div class="banner-dots">${banners.map((_,i)=>`<i class="${i===bannerIndex?'active':''}" data-banner="${i}"></i>`).join('')}</div></section><div class="section-head"><h3>商品分类</h3><button data-go="category">查看全部 ›</button></div><div class="cats">${categories.slice(1,7).map((c,i)=>`<button class="cat" data-cat="${c}" style="border:0;background:none"><div class="bubble">${['୨୧','🧸','♧','✦','⌇','⌂'][i]}</div><div>${c}</div></button>`).join('')}</div><div class="section-head"><h3>热卖推荐</h3><button data-refresh>换一批 ↻</button></div><div class="products">${featured.slice(0,6).map(productCard).join('')}</div><div class="section-head"><h3>新品上架</h3><button data-go="category">更多 ›</button></div><div class="products">${featured.slice(6,10).map(productCard).join('')}</div></div>`}
    function category(){const list=categoryName==='全部'?products:products.filter(p=>p.cat===categoryName);return `<div class="page">${header('分类','7 CATEGORIES · 42 ITEMS')}<div class="pills">${categories.map(c=>`<button class="pill ${c===categoryName?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><p class="page-sub">${categoryName} · ${list.length} 件商品</p>${list.map(p=>`<article class="wide-card" data-detail="${p.id}"><div class="pic" style="background-image:url('${p.img}')"></div><div style="flex:1;position:relative"><button class="heart ${favorites.has(p.id)?'active':''}" data-fav="${p.id}" style="right:0;top:0">♥</button><h4>${p.name}</h4><p>${p.meta}</p><div class="price"><span>${money(p.price)}</span><button class="plus" data-add="${p.id}">＋</button></div></div></article>`).join('')}</div>`}
    function ai(){const messages=chatMessages.map(m=>`<div class="bubble ${m.role}">${m.text}</div>${(m.productIds||[]).map(id=>{const p=products.find(x=>x.id===id);return `<div class="ai-card"><div class="pic" style="background-image:url('${p.img}')"></div><div style="flex:1"><b>${p.name}</b><p class="meta">${p.meta} · ${money(p.price)}</p><button class="pill active" data-add="${p.id}">加入购物车</button></div></div>`}).join('')}`).join('');return `<div class="page ai-page"><header><button class="icon-btn" data-history aria-label="对话历史">☰</button><div class="brand" style="text-align:center"><small>SHOPPING COPILOT</small><strong>AI 选购</strong></div><button class="icon-btn" data-new-chat aria-label="新对话">＋</button></header><div class="quick-prompts"><button data-prompt="50 元内送同学的礼物">50 元内送同学</button><button data-prompt="帮我搭一套通勤饰品">搭通勤饰品</button><button data-prompt="比较两款收纳包">比较收纳包</button></div><div class="chat" id="chatList">${messages}</div><div class="chat-input"><button class="more" data-more aria-label="图片与语音">＋</button><input id="aiInput" placeholder="输入预算、场景或偏好…"><button data-send aria-label="发送">➤</button></div></div>`}
    function cartPage(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<div class="page">${header('购物车',`${cart.length} ITEMS`)}${cart.length?cart.map(x=>`<div class="cart-row"><div class="pic" style="background-image:url('${x.img}')"></div><div><b>${x.name}</b><p class="meta">${money(x.price)}</p></div><div class="qty"><button data-qty="${x.id}" data-delta="-1">−</button><span>${x.qty}</span><button data-qty="${x.id}" data-delta="1">＋</button></div></div>`).join('')+`<div class="summary"><div><span>商品金额</span><span>${money(total)}</span></div><div><span>优惠</span><span>− ¥ 0.0</span></div><div><span>配送费</span><span>¥ 0.0</span></div><div class="total"><span>合计</span><span>${money(total)}</span></div></div><button class="primary" data-checkout>去结算</button>`:`<div class="empty"><b>♧</b>购物车还是空的<br><button class="pill active" data-go="home">去逛逛</button></div>`}</div>`}
    function mine(){const order=lastOrder||{number:'CH26081601',items:[{name:'云朵挂件',qty:1},{name:'花瓣便签',qty:1}],total:42.8,status:'待收货'};return `<div class="page">${header('我的','MEMBER CENTER')}<div class="profile-card"><div class="avatar">C</div><div><b>Charmora 会员</b><small>普通会员 · 完善个人资料 ›</small></div></div><div class="section-head"><h3>我的订单</h3><button>全部订单 ›</button></div><div class="order-grid"><button><span>▣</span>待付款</button><button><span>▤</span>待发货</button><button><span>▥</span>待收货</button><button><span>♡</span>待评价</button></div><article class="order"><div class="order-top"><span>订单 ${order.number}</span><strong>${order.status}</strong></div><p>${order.items.map(x=>`${x.name} × ${x.qty}`).join(' · ')}</p><div class="price"><span>订单金额</span><b>${money(order.total)}</b></div><div class="timeline"><div>订单已提交</div><div>支付成功</div><div>${order.status}</div></div></article><div class="section-head"><h3>常用服务</h3></div><div class="service-grid"><button data-service="我的收藏"><span>♥</span>我的收藏 · ${favorites.size}</button><button data-service="优惠券"><span>◇</span>优惠券 · 3</button><button data-service="收货地址"><span>⌖</span>收货地址</button><button data-service="到店自取"><span>⌂</span>自取门店</button><button data-service="联系客服"><span>◌</span>联系客服</button><button data-service="账号设置"><span>⚙</span>账号设置</button></div></div>`}
    function detail(id){const p=products.find(x=>x.id==id);return `<div class="page detail"><div class="detail-hero" style="background-image:url('${p.img}')"><button class="icon-btn back" data-back>‹</button><button class="heart ${favorites.has(p.id)?'active':''}" data-fav="${p.id}" style="top:14px">♥</button></div><h2>${p.name}</h2><p class="page-sub">${p.meta}</p><div class="price" style="font-size:22px"><span>${money(p.price)}</span><small>月销 268 · 好评 98%</small></div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="section-head"><h3>选择规格</h3></div><div class="spec-row"><button class="spec active">默认款</button><button class="spec">礼袋装</button><button class="spec">礼盒装</button></div><div class="section-head"><h3>商品介绍</h3></div><p class="page-sub" style="line-height:1.8">选用舒适耐用的日常材质，兼顾外观与实用性。柔和配色适合通勤、宿舍和日常送礼，包装简洁，可与同系列商品自由搭配。</p><div class="detail-hero" style="height:190px;background-image:url('${p.img}')"></div><div class="section-head"><h3>用户评价</h3><button>查看全部 126 条 ›</button></div><div class="review"><div class="review-head"><b>小满同学</b><span>★★★★★</span></div>颜色很温柔，实物和图片一致，包装也很仔细。日常使用大小刚刚好。</div><div class="review"><div class="review-head"><b>一颗桃子</b><span>★★★★★</span></div>送朋友很合适，质感比预期好，下次会考虑同系列。</div><div class="section-head"><h3>常见问题</h3></div><div class="summary"><div><span>是否支持到店自取？</span><b>支持 ›</b></div><div><span>什么时候发货？</span><b>48 小时内 ›</b></div></div><button class="primary" data-add="${p.id}">加入购物车</button><button class="secondary" style="margin-top:9px" data-ask="${p.id}">问问 AI 是否适合我</button></div>`}
    function checkout(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0);sheetBody.innerHTML=`<h2 class="page-title">确认订单</h2><div class="delivery"><button class="active" data-delivery="ship">配送到家</button><button data-delivery="pickup">到店自取</button></div><div id="deliveryFields"><div class="field"><label>收货人</label><input value="林同学"></div><div class="field"><label>手机号</label><input value="138 0000 0000"></div><div class="field"><label>收货地址</label><input value="广东省广州市天河区体育西路 88 号"></div></div><div class="field"><label>优惠券</label><input value="暂无可用优惠券" readonly></div><label class="page-sub">支付方式</label><div class="pay"><button class="active">微信支付</button><button>支付宝</button><button>银行卡</button></div><div class="summary"><div><span>商品金额</span><b>${money(total)}</b></div><div><span>配送费</span><b>¥ 0.0</b></div><div class="total"><span>应付</span><span>${money(total)}</span></div></div><button class="primary" data-confirm>提交订单</button><button class="secondary" style="margin-top:8px" data-close>返回购物车</button>`;sheet.classList.add('open');bindSheet(total)}
    function bindSheet(total){document.querySelectorAll('[data-delivery]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-delivery]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#deliveryFields').innerHTML=b.dataset.delivery==='pickup'?`<div class="field"><label>自取门店</label><input value="Charmora 天河体验店 · 距离 1.2km"></div><div class="field"><label>取货人</label><input value="林同学 · 138 0000 0000"></div>`:`<div class="field"><label>收货人</label><input value="林同学"></div><div class="field"><label>手机号</label><input value="138 0000 0000"></div><div class="field"><label>收货地址</label><input value="广东省广州市天河区体育西路 88 号"></div>`});document.querySelectorAll('.pay button').forEach(b=>b.onclick=()=>document.querySelectorAll('.pay button').forEach(x=>x.classList.toggle('active',x===b)));document.querySelector('[data-close]').onclick=()=>sheet.classList.remove('open');document.querySelector('[data-confirm]').onclick=()=>{lastOrder={number:`CH${new Date().toISOString().slice(2,10).replaceAll('-','')}01`,items:cart.map(({name,qty})=>({name,qty})),total,status:'待发货'};sheet.classList.remove('open');cart=[];render('mine');notify('订单提交成功')}}
    function notice(){sheetBody.innerHTML=`<h2 class="page-title">消息通知</h2><div class="history-item">订单状态更新<small>你的订单正在备货，请留意后续通知。</small></div><div class="history-item">新品上架<small>柔雾饰品系列已上新。</small></div><button class="secondary" data-close>关闭</button>`;sheet.classList.add('open');document.querySelector('[data-close]').onclick=()=>sheet.classList.remove('open')}
    function history(){historyPanel.innerHTML=`<h2 class="page-title">选购记录</h2><button class="primary" data-new-chat>＋ 新对话</button><div class="history-item">50 元内送同学的礼物<small>今天 14:20</small></div><div class="history-item">通勤饰品怎么搭<small>昨天 21:06</small></div><div class="history-item">比较两款收纳包<small>8 月 14 日</small></div>`;historyMask.classList.add('open');historyPanel.querySelector('[data-new-chat]').onclick=()=>{chatMessages=[{role:'ai',text:'新对话已开始。今天想选什么？'}];historyMask.classList.remove('open');render('ai')}}
    function sendAI(text){const value=(text||document.querySelector('#aiInput')?.value||'').trim();if(!value)return;chatMessages.push({role:'me',text:value});let reply='我会先确认预算、使用场景和偏好，再从当前商品中筛选。你更看重外观、实用性还是价格？',recommended=[];const budget=Number(value.match(/(\d+)\s*元/)?.[1]||50);const uniqueBase=list=>list.filter((p,index,all)=>all.findIndex(x=>x.baseId===p.baseId)===index);if(value.includes('礼物')){recommended=uniqueBase(products.filter(p=>['礼赠组合','挂件毛绒'].includes(p.cat)&&p.price<=budget)).slice(0,2);reply=`在 ${budget} 元预算内找到 ${recommended.length} 个合适选项，偏可爱、包装也适合直接送人。`;}else if(value.includes('通勤')){recommended=[products[0],products[12]];reply='这两件配色柔和、日常利用率高，适合通勤场景。';}else if(value.includes('比较')){recommended=uniqueBase(products.filter(p=>p.cat==='包袋收纳')).slice(0,2);reply='我先列出两款收纳商品，可以继续从容量、材质、价格和使用场景比较。';}chatMessages.push({role:'ai',text:reply,productIds:recommended.map(p=>p.id)});render('ai');setTimeout(()=>{root.scrollTop=root.scrollHeight},10)}
    function render(page='home'){current=page;root.scrollTop=0;root.innerHTML=({home,category,ai,cart:cartPage,mine}[page]||home)();document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('active',n.dataset.page===page));bind()}
    function bind(){document.querySelectorAll('[data-page],[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.page||x.dataset.go));document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=e=>{if(!e.target.closest('[data-add],[data-fav]')){root.innerHTML=detail(x.dataset.detail);root.scrollTop=0;bind()}});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=e=>{e.stopPropagation();const p=products.find(v=>v.id==x.dataset.add),found=cart.find(v=>v.id===p.id);found?found.qty++:cart.push({...p,qty:1});notify(`${p.name} 已加入购物车`)});document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();const id=Number(x.dataset.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);x.classList.toggle('active',favorites.has(id));notify(favorites.has(id)?'已加入收藏':'已取消收藏')});document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{categoryName=x.dataset.filter;render('category')});document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{categoryName=x.dataset.cat;render('category')});document.querySelectorAll('[data-banner-cat]').forEach(x=>x.onclick=()=>{categoryName=x.dataset.bannerCat;render('category')});document.querySelectorAll('[data-banner]').forEach(x=>x.onclick=()=>{bannerIndex=Number(x.dataset.banner);render('home')});document.querySelectorAll('[data-qty]').forEach(x=>x.onclick=()=>{const item=cart.find(v=>v.id==x.dataset.qty);item.qty+=Number(x.dataset.delta);cart=cart.filter(v=>v.qty>0);render('cart')});document.querySelector('[data-back]')?.addEventListener('click',()=>render('category'));document.querySelector('[data-checkout]')?.addEventListener('click',checkout);document.querySelectorAll('[data-notice]').forEach(x=>x.onclick=notice);document.querySelector('[data-history]')?.addEventListener('click',history);document.querySelectorAll('[data-new-chat]').forEach(x=>x.onclick=()=>{chatMessages=[{role:'ai',text:'新对话已开始。今天想选什么？'}];render('ai')});document.querySelector('[data-send]')?.addEventListener('click',()=>sendAI());document.querySelector('#aiInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendAI()});document.querySelectorAll('[data-prompt]').forEach(x=>x.onclick=()=>sendAI(x.dataset.prompt));document.querySelector('[data-more]')?.addEventListener('click',()=>notify('可以选择相册、拍照或语音输入'));document.querySelector('[data-ask]')?.addEventListener('click',e=>{const p=products.find(v=>v.id==e.target.dataset.ask);chatMessages.push({role:'me',text:`${p.name}适合我吗？`});render('ai')});document.querySelectorAll('[data-service]').forEach(x=>x.onclick=()=>notify(`${x.dataset.service}功能入口`));document.querySelector('[data-search]')?.addEventListener('click',()=>{const q=document.querySelector('#homeSearch').value.trim();categoryName='全部';render('category');notify(q?`已搜索：${q}`:'请输入商品名称')});document.querySelector('[data-refresh]')?.addEventListener('click',()=>notify('已为你更新推荐'))}
    sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};historyMask.onclick=e=>{if(e.target===historyMask)historyMask.classList.remove('open')};render();
  </script>
</body>
</html>
