<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>绮饰集 Charmora · 商城原型</title>
  <style>
    :root{--paper:#fff9fb;--rose:#c98fa6;--rose-2:#e7bdca;--rose-3:#f5e4ea;--lilac:#b4a1c8;--lilac-2:#ded4e8;--ink:#6f5967;--muted:#a38c99;--line:#ead9e1;--white:#fffdfd;--shadow:0 18px 50px rgba(151,111,133,.16)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;background:radial-gradient(circle at 20% 5%,#f7dfe9 0,transparent 28%),radial-gradient(circle at 85% 90%,#e6ddf0 0,transparent 30%),#f6eff3;display:grid;place-items:center;padding:28px}
    button,input{font:inherit;color:inherit}.stage{display:flex;gap:36px;align-items:center}.notes{width:290px}.notes .eyebrow{color:var(--rose);letter-spacing:.18em;font-size:12px;font-weight:700}.notes h1{font-family:Georgia,"Songti SC",serif;font-size:38px;line-height:1.18;margin:12px 0 14px;color:#826170}.notes p{line-height:1.8;color:#947d89;font-size:14px}.palette{display:flex;gap:8px;margin:22px 0}.swatch{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.65);box-shadow:0 3px 10px rgba(126,89,108,.12)}.tip{padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,253,.62);font-size:12px;line-height:1.65}
    .phone{width:390px;height:844px;background:var(--paper);border:9px solid #e7d6df;border-radius:46px;box-shadow:0 30px 80px rgba(103,72,91,.23);overflow:hidden;position:relative}.status{height:32px;padding:10px 25px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700}.app{height:calc(100% - 32px);overflow:hidden;position:relative}.screen{height:calc(100% - 70px);overflow-y:auto;padding:0 18px 28px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 1px 15px}.brand small{display:block;color:var(--rose);letter-spacing:.2em;font-size:9px;font-weight:700}.brand strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:24px;color:#826170;letter-spacing:.04em}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--white);border-radius:15px;display:grid;place-items:center;font-size:17px}
    .search{height:48px;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 8px 22px rgba(174,128,151,.08)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.search span{color:var(--rose)}
    .hero{height:174px;margin:16px 0 20px;border-radius:28px;background:linear-gradient(130deg,#d6a5b8,#b7a4cb);position:relative;overflow:hidden;padding:23px;color:#fff}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}.hero:before{width:140px;height:140px;right:-24px;top:-30px}.hero:after{width:90px;height:90px;right:72px;bottom:-55px}.hero .mini{font-size:10px;letter-spacing:.16em}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:24px;line-height:1.35;margin:8px 0 15px;width:220px}.hero button{border:0;background:rgba(255,255,255,.88);color:#956c7e;border-radius:999px;padding:9px 15px;font-size:12px;font-weight:700}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 12px}.section-head h3{margin:0;font-family:Georgia,"Songti SC",serif;font-size:19px;color:#826170}.section-head button{border:0;background:none;color:var(--muted);font-size:11px}.cats{display:flex;gap:10px;overflow:auto;padding:2px 1px 5px;scrollbar-width:none}.cat{min-width:70px;text-align:center}.cat .bubble{width:62px;height:62px;border-radius:23px;margin:auto;display:grid;place-items:center;font-size:25px;background:var(--rose-3);border:1px solid #efd7e1}.cat:nth-child(even) .bubble{background:#eee8f4;border-color:#e3d9eb}.cat div:last-child{font-size:11px;margin-top:7px;color:#8c7581}
    .products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:9px;position:relative;box-shadow:0 8px 22px rgba(157,116,137,.08)}.pic{height:137px;border-radius:16px;background:#f3e6eb center/cover no-repeat}.card:nth-child(2) .pic{background-color:#e9e1ef}.heart{position:absolute;right:16px;top:16px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,253,253,.82);color:var(--rose)}.card h4{font-size:13px;margin:10px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .meta{font-size:10px;color:var(--muted);margin:0 2px}.price{display:flex;align-items:center;justify-content:space-between;margin:9px 2px 2px;color:#b27790;font-weight:700}.plus{width:28px;height:28px;border:0;border-radius:10px;color:white;background:var(--rose)}
    nav{height:70px;position:absolute;bottom:0;left:0;right:0;background:rgba(255,250,252,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px 8px;backdrop-filter:blur(14px)}nav button{border:0;background:none;color:#ad98a4;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:20px;line-height:24px}nav button.active{color:#b57891;font-weight:700}.ai-nav span{width:39px;height:32px;border-radius:14px;background:linear-gradient(135deg,var(--rose),var(--lilac));color:white;display:grid;place-items:center;margin-top:-7px;box-shadow:0 7px 16px rgba(174,125,151,.25)}
    .toast{position:absolute;left:50%;bottom:82px;transform:translate(-50%,20px);background:#8f7483;color:white;border-radius:999px;padding:10px 18px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .page{animation:pageIn .22s ease both}@keyframes pageIn{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}.page-title{font-family:Georgia,"Songti SC",serif;font-size:25px;margin:12px 0 5px;color:#826170}.page-sub{font-size:12px;color:var(--muted);margin:0 0 18px}.pills{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin:13px 0}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--white);padding:9px 13px;font-size:11px}.pill.active{background:var(--rose);border-color:var(--rose);color:white}.wide-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:10px;margin:10px 0}.wide-card .pic{width:98px;height:98px;flex:none}.wide-card h4{margin:6px 0 5px;font-size:14px}.wide-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.wide-card .price{margin-top:10px}.detail-hero{height:290px;border-radius:28px;background:#f0e3e9 center/cover no-repeat;position:relative}.back{position:absolute;top:14px;left:14px}.detail h2{font-family:Georgia,"Songti SC",serif;font-size:23px;margin:18px 0 6px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{font-size:10px;background:var(--rose-3);color:#9a7082;border-radius:999px;padding:7px 10px}.primary{width:100%;border:0;border-radius:17px;background:linear-gradient(135deg,var(--rose),var(--lilac));color:white;padding:14px;font-weight:700;box-shadow:0 10px 20px rgba(174,125,151,.2)}.secondary{width:100%;border:1px solid var(--line);border-radius:17px;background:var(--white);padding:13px}.cart-row{display:grid;grid-template-columns:76px 1fr auto;gap:11px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:21px;padding:9px;margin:10px 0}.cart-row .pic{height:76px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:27px;height:27px;border:0;border-radius:9px;background:var(--rose-3)}.summary{background:#f8edf1;border-radius:22px;padding:16px;margin:18px 0}.summary div{display:flex;justify-content:space-between;font-size:12px;margin:8px 0}.summary .total{font-size:17px;font-weight:700;color:#a66f87;border-top:1px solid #e6ced9;padding-top:12px}.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:88px}.bubble{max-width:86%;border-radius:20px;padding:12px 14px;font-size:12px;line-height:1.65}.bubble.ai{background:var(--white);border:1px solid var(--line);border-top-left-radius:7px}.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#d6a5b8,#b7a4cb);color:white;border-bottom-right-radius:7px}.ai-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;gap:10px}.ai-card .pic{width:64px;height:64px}.chat-input{position:absolute;left:12px;right:12px;bottom:78px;border:1px solid var(--line);border-radius:20px;background:rgba(255,253,253,.96);padding:7px;display:flex;gap:7px;box-shadow:var(--shadow)}.chat-input input{flex:1;border:0;background:transparent;outline:0;padding:0 8px;font-size:12px}.chat-input button{width:40px;height:40px;border:0;border-radius:14px;background:var(--rose);color:white}.order{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:15px;margin:11px 0}.order-top{display:flex;justify-content:space-between;font-size:12px}.order strong{color:#a56e86}.timeline{border-left:2px solid var(--rose-2);margin:15px 5px;padding-left:15px}.timeline div{font-size:11px;margin:13px 0;position:relative}.timeline div:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--rose);left:-20px;top:4px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:38px;margin-bottom:12px}.sheet{position:absolute;inset:0;background:rgba(111,89,103,.18);z-index:8;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s}.sheet.open{opacity:1;pointer-events:auto}.sheet-body{width:100%;max-height:86%;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:20px 20px 28px;transform:translateY(100%);transition:.25s}.sheet.open .sheet-body{transform:none}.field{margin:11px 0}.field label{font-size:10px;color:var(--muted);display:block;margin:0 0 5px 4px}.field input{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:12px;outline:0}.pay{display:flex;gap:8px;margin:12px 0}.pay button{flex:1;border:1px solid var(--line);background:white;border-radius:14px;padding:10px 4px;font-size:10px}.pay button.active{border-color:var(--rose);background:var(--rose-3)}
    @media(max-width:760px){body{padding:0;background:var(--paper)}.stage{display:block}.notes{display:none}.phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="stage">
    <aside class="notes">
      <div class="eyebrow">UI DIRECTION 01</div>
      <h1>柔和，但不甜腻。<br>像一家会懂你的店。</h1>
      <p>以灰调玫瑰粉和雾紫为主色，不使用纯黑。AI 是贯穿选购、比较、加购和结算确认的辅助能力，不再把产品局限为“寻物”。</p>
      <div class="palette"><i class="swatch" style="background:#c98fa6"></i><i class="swatch" style="background:#e7bdca"></i><i class="swatch" style="background:#b4a1c8"></i><i class="swatch" style="background:#fff9fb"></i><i class="swatch" style="background:#6f5967"></i></div>
      <div class="tip">当前原型已覆盖：首页、分类、详情、AI 选购、购物车、结算、订单与状态反馈。底部导航始终保留，AI 不再跳出商城。</div>
    </aside>
    <section class="phone" aria-label="绮饰集 Charmora 手机商城原型">
      <div class="status"><span>9:41</span><span>◔ ᯤ ▰</span></div>
      <div class="app">
        <div class="screen" id="screen"></div>
        <nav><button data-page="home" class="active"><span>⌂</span>首页</button><button data-page="category"><span>⌗</span>分类</button><button data-page="ai" class="ai-nav"><span>✦</span>AI选购</button><button data-page="cart"><span>♧</span>购物车</button><button data-page="mine"><span>♙</span>我的</button></nav>
        <div class="toast" role="status">已加入购物车 ♡</div>
        <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
      </div>
    </section>
  </main>
  <script>
    const root=document.querySelector('#screen'),toast=document.querySelector('.toast'),sheet=document.querySelector('#sheet'),sheetBody=document.querySelector('#sheetBody');
    const img=i=>`../../ecommerce_agent_dataset/synthetic_lifestyle_v1/images/category-0${i}.jpg`;
    const products=[
      {id:1,name:'软乎乎云朵挂件',meta:'轻柔触感 · 通勤陪伴',price:29.9,img:img(2),cat:'挂件毛绒'},
      {id:2,name:'雾紫随行收纳包',meta:'分区收纳 · 防泼水',price:39.9,img:img(3),cat:'包袋收纳'},
      {id:3,name:'花瓣便签组合',meta:'柔和配色 · 80 张',price:12.9,img:img(5),cat:'文具'},
      {id:4,name:'小小心意礼赠盒',meta:'已搭配 · 可写祝福',price:59.9,img:img(7),cat:'礼赠组合'}];
    let cart=[{...products[0],qty:1},{...products[1],qty:1}],current='home',lastOrder=null;
    const money=n=>`¥ ${n.toFixed(1)}`; const notify=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};
    const header=(title='绮饰集',sub='CHARMORA · LIFESTYLE')=>`<header><div class="brand"><small>${sub}</small><strong>${title}</strong></div><button class="icon-btn">♡</button></header>`;
    const productCard=p=>`<article class="card" data-detail="${p.id}"><div class="pic" style="background-image:url('${p.img}')"></div><button class="heart">♡</button><h4>${p.name}</h4><p class="meta">${p.meta}</p><div class="price"><span>${money(p.price)}</span><button class="plus" data-add="${p.id}">＋</button></div></article>`;
    function home(){return `<div class="page">${header()}<label class="search"><span>⌕</span><input placeholder="搜索饰品、小物，或说说你的需求"></label><section class="hero"><div class="mini">AI SHOPPING COPILOT</div><h2>从灵感到下单，<br>陪你选得刚刚好。</h2><button data-go="ai">让 AI 帮我选 →</button></section><div class="section-head"><h3>慢慢逛，好好选</h3><button data-go="category">全部分类 ›</button></div><div class="cats"><div class="cat"><div class="bubble">୨୧</div><div>首饰发饰</div></div><div class="cat"><div class="bubble">🧸</div><div>挂件毛绒</div></div><div class="cat"><div class="bubble">♧</div><div>包袋收纳</div></div><div class="cat"><div class="bubble">✦</div><div>美妆工具</div></div><div class="cat"><div class="bubble">⌇</div><div>家居日用</div></div></div><div class="section-head"><h3>今日心动</h3><button>换一批 ↻</button></div><div class="products">${products.map(productCard).join('')}</div></div>`}
    function category(){return `<div class="page">${header('全部分类','7 CATEGORIES · 42 ITEMS')}<label class="search"><span>⌕</span><input placeholder="在全部商品中搜索"></label><div class="pills"><button class="pill active">全部</button><button class="pill">首饰发饰</button><button class="pill">挂件毛绒</button><button class="pill">包袋收纳</button></div>${products.map(p=>`<article class="wide-card" data-detail="${p.id}"><div class="pic" style="background-image:url('${p.img}')"></div><div><h4>${p.name}</h4><p>${p.cat}<br>${p.meta}</p><div class="price"><span>${money(p.price)}</span><button class="plus" data-add="${p.id}">＋</button></div></div></article>`).join('')}</div>`}
    function ai(){return `<div class="page">${header('AI 选购','CONTROLLED SHOPPING COPILOT')}<p class="page-sub">告诉我预算、场景与偏好，我只推荐真实在库商品。</p><div class="chat"><div class="bubble ai">你好呀，我可以帮你找商品、做组合、比较差异，也可以加购和生成结算预览。下单前一定会再向你确认。</div><div class="bubble me">50 元内送同学的可爱小礼物</div><div class="bubble ai">我选了一个轻松不挑人的组合，总价 42.8 元，目前都有库存：</div><div class="ai-card"><div class="pic" style="background-image:url('${products[0].img}')"></div><div><b>${products[0].name}</b><p class="meta">搭配花瓣便签 · 合计 ¥42.8</p><button class="pill active" data-add="1">加入组合</button></div></div><div class="bubble ai">如果你说“去结算”，我只会生成预览；你明确说“确认下单”后才会创建模拟订单。</div></div><div class="chat-input"><input placeholder="继续说说你的需求…"><button data-send>➤</button></div></div>`}
    function cartPage(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<div class="page">${header('购物车',`${cart.length} ITEMS · SERVER CART`)}${cart.length?cart.map(x=>`<div class="cart-row"><div class="pic" style="background-image:url('${x.img}')"></div><div><b>${x.name}</b><p class="meta">${money(x.price)}</p></div><div class="qty"><button data-qty="${x.id}" data-delta="-1">−</button><span>${x.qty}</span><button data-qty="${x.id}" data-delta="1">＋</button></div></div>`).join('')+`<div class="summary"><div><span>商品金额</span><span>${money(total)}</span></div><div><span>配送费</span><span>演示 ¥0</span></div><div class="total"><span>合计</span><span>${money(total)}</span></div></div><button class="primary" data-checkout>去结算 · 演示支付</button>`:`<div class="empty"><b>♧</b>购物车还是空的<br><button class="pill active" data-go="home">去逛逛</button></div>`}</div>`}
    function mine(){const order=lastOrder||{number:'CH26081601',items:[{name:'云朵挂件',qty:1},{name:'花瓣便签',qty:1}],total:42.8};return `<div class="page">${header('我的','DEMO PROFILE')}<div class="hero" style="height:125px"><div class="mini">CHARMORA MEMBER</div><h2 style="font-size:20px">下午好，今天也要<br>选到喜欢的小物。</h2></div><div class="section-head"><h3>我的订单</h3><button>全部 ›</button></div><article class="order"><div class="order-top"><span>订单 ${order.number}</span><strong>备货中</strong></div><p>${order.items.map(x=>`${x.name} × ${x.qty}`).join(' · ')}</p><div class="price"><span>演示支付成功</span><b>${money(order.total)}</b></div><div class="timeline"><div>订单已确认</div><div>模拟支付成功</div><div>正在备货</div></div></article><button class="secondary" data-settings>服务连接与演示设置</button></div>`}
    function detail(id){const p=products.find(x=>x.id==id);return `<div class="page detail"><div class="detail-hero" style="background-image:url('${p.img}')"><button class="icon-btn back" data-back>‹</button></div><h2>${p.name}</h2><p class="page-sub">${p.meta}</p><div class="price" style="font-size:22px"><span>${money(p.price)}</span><small>库存 18</small></div><div class="tags"><span class="tag">真实在库</span><span class="tag">模拟商品</span><span class="tag">支持 AI 比较</span></div><div class="summary"><div><span>规格</span><b>默认款 ›</b></div><div><span>配送</span><b>演示配送 · 免运费</b></div></div><button class="primary" data-add="${p.id}">加入购物车</button><button class="secondary" style="margin-top:9px" data-go="ai">让 AI 帮我比较</button></div>`}
    function checkout(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0);sheetBody.innerHTML=`<h2 class="page-title">确认订单</h2><p class="page-sub">仅作作品演示，不产生真实支付和物流。</p><div class="field"><label>收货人</label><input value="演示用户"></div><div class="field"><label>手机号</label><input value="13800000000"></div><div class="field"><label>收货地址</label><input value="幸福路 1 号（演示地址）"></div><label class="page-sub">演示支付方式</label><div class="pay"><button class="active">微信</button><button>支付宝</button><button>银行卡</button></div><div class="summary"><div><span>库存与价格已复核</span><b>✓</b></div><div class="total"><span>应付</span><span>${money(total)}</span></div></div><button class="primary" data-confirm>确认演示支付</button><button class="secondary" style="margin-top:8px" data-close>返回修改</button>`;sheet.classList.add('open');document.querySelector('[data-confirm]').onclick=()=>{lastOrder={number:`CH${new Date().toISOString().slice(2,10).replaceAll('-','')}01`,items:cart.map(({name,qty})=>({name,qty})),total};sheet.classList.remove('open');cart=[];render('mine');notify('模拟下单成功 · 已进入备货中')};bind()}
    function render(page='home'){current=page;root.scrollTop=0;root.innerHTML=({home,category,ai,cart:cartPage,mine}[page]||home)();document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('active',n.dataset.page===page));bind()}
    function bind(){document.querySelectorAll('[data-page],[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.page||x.dataset.go));document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=e=>{if(!e.target.closest('[data-add]')){root.innerHTML=detail(x.dataset.detail);root.scrollTop=0;bind()}});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=e=>{e.stopPropagation();const p=products.find(v=>v.id==x.dataset.add),found=cart.find(v=>v.id===p.id);found?found.qty++:cart.push({...p,qty:1});notify(`${p.name} 已加入购物车 ♡`)});document.querySelectorAll('[data-qty]').forEach(x=>x.onclick=()=>{const item=cart.find(v=>v.id==x.dataset.qty);item.qty+=Number(x.dataset.delta);cart=cart.filter(v=>v.qty>0);render('cart')});document.querySelector('[data-back]')?.addEventListener('click',()=>render(current==='category'?'category':'home'));document.querySelector('[data-checkout]')?.addEventListener('click',checkout);document.querySelector('[data-close]')?.addEventListener('click',()=>sheet.classList.remove('open'));document.querySelector('[data-send]')?.addEventListener('click',()=>notify('演示：需求已发送给可控 Agent'));document.querySelector('[data-settings]')?.addEventListener('click',()=>notify('服务已连接 · 42 件商品可用'))}
    sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};render();
  </script>
</body>
</html>
